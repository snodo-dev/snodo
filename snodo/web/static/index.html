<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>snodo · local</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#060a0b; --bg-2:#0b1215; --bg-3:#0f181c;
      --teal:#2dd4bf; --teal-dim:rgba(45,212,191,.1); --teal-border:rgba(45,212,191,.22); --teal-soft:rgba(45,212,191,.04);
      --text:#dde8ea; --text-dim:#7090a0; --text-muted:#66808f; --text-faint:#3c5560; --code-bg:#0b1518;
      --grid:rgba(45,212,191,.035);
      --flow-feature:#2dd4bf; --flow-defect:#fb7185; --flow-debt:#fbbf24; --flow-risk:#a78bfa;
       --pass:#4ade80; --pass-dim:rgba(74,222,128,.1); --pass-border:rgba(74,222,128,.24);
      --blocked:#ff6b5e; --blocked-dim:rgba(255,107,94,.1); --blocked-border:rgba(255,107,94,.26);
      --abstained:#e0a83a; --abstained-dim:rgba(224,168,58,.1); --abstained-border:rgba(224,168,58,.24);
      --running:#38bdf8; --running-dim:rgba(56,189,248,.1); --running-border:rgba(56,189,248,.24);
       --automated:#a78bfa; --automated-dim:rgba(167,139,250,.1); --automated-border:rgba(167,139,250,.24);
      --line:rgba(255,255,255,.06); --line-subtle:rgba(255,255,255,.04); --line-2:rgba(255,255,255,.1);
      --overlay:rgba(255,255,255,.04); --overlay-2:rgba(255,255,255,.08); --shadow:none; --on-teal:var(--bg);
      --r-1:2px; --r-2:4px; --r-3:8px; --r-pill:999px;
      --fs-micro:10px; --fs-small:11px; --fs-body:13px; --fs-lead:14px; --fs-title:20px; --fs-loud:30px;
      --serif:'Archivo',Arial,sans-serif; --body:'Hanken Grotesk',Arial,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
      --background:var(--bg); --surface:var(--bg-2); --border:var(--line); --accent:var(--teal);
      --muted:var(--text-muted); --amber:var(--abstained); --red:var(--blocked); --green:var(--pass);
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) { color-scheme:light;
        --bg:#f5f7f7; --bg-2:#ffffff; --bg-3:#eef2f3; --teal:#0f766e; --teal-dim:rgba(15,118,110,.08); --teal-border:rgba(15,118,110,.26); --teal-soft:rgba(15,118,110,.04);
        --text:#13201f; --text-dim:#4a5f66; --text-muted:#5d7179; --text-faint:#c9d4d7; --code-bg:#f1f5f5; --grid:rgba(15,118,110,.025);
        --flow-feature:#0f766e; --flow-defect:#be123c; --flow-debt:#a16207; --flow-risk:#6d28d9;
         --pass:#15803d; --pass-dim:rgba(21,128,61,.08); --pass-border:rgba(21,128,61,.26);
        --blocked:#d42a1f; --blocked-dim:rgba(212,42,31,.08); --blocked-border:rgba(212,42,31,.26);
        --abstained:#9a6208; --abstained-dim:rgba(154,98,8,.08); --abstained-border:rgba(154,98,8,.26);
        --running:#0369a1; --running-dim:rgba(3,105,161,.08); --running-border:rgba(3,105,161,.26);
       --automated:#6d4fd1; --automated-dim:rgba(109,79,209,.08); --automated-border:rgba(109,79,209,.28);
       --serif:'Archivo',Arial,sans-serif; --body:'Hanken Grotesk',Arial,sans-serif;
        --line:rgba(16,40,44,.09); --line-subtle:rgba(16,40,44,.06); --line-2:rgba(16,40,44,.16);
        --overlay:rgba(16,40,44,.035); --overlay-2:rgba(16,40,44,.07); --shadow:0 1px 2px rgba(16,40,44,.08); --on-teal:#fff;
      }
    }
    :root[data-theme="light"] {
      color-scheme:light;
      --bg:#f5f7f7; --bg-2:#ffffff; --bg-3:#eef2f3; --teal:#0f766e; --teal-dim:rgba(15,118,110,.08); --teal-border:rgba(15,118,110,.26); --teal-soft:rgba(15,118,110,.04);
      --text:#13201f; --text-dim:#4a5f66; --text-muted:#5d7179; --text-faint:#c9d4d7; --code-bg:#f1f5f5; --grid:rgba(15,118,110,.025);
      --flow-feature:#0f766e; --flow-defect:#be123c; --flow-debt:#a16207; --flow-risk:#6d28d9;
      --pass:#15803d; --pass-dim:rgba(21,128,61,.08); --pass-border:rgba(21,128,61,.26);
      --blocked:#d42a1f; --blocked-dim:rgba(212,42,31,.08); --blocked-border:rgba(212,42,31,.26);
      --abstained:#9a6208; --abstained-dim:rgba(154,98,8,.08); --abstained-border:rgba(154,98,8,.26);
      --running:#0369a1; --running-dim:rgba(3,105,161,.08); --running-border:rgba(3,105,161,.26);
         --automated:#6d4fd1; --automated-dim:rgba(109,79,209,.08); --automated-border:rgba(109,79,209,.28);
      --line:rgba(16,40,44,.09); --line-subtle:rgba(16,40,44,.06); --line-2:rgba(16,40,44,.16);
      --overlay:rgba(16,40,44,.035); --overlay-2:rgba(16,40,44,.07); --shadow:0 1px 2px rgba(16,40,44,.08); --on-teal:#fff;
      --serif:'Archivo',Arial,sans-serif; --body:'Hanken Grotesk',Arial,sans-serif;
    }
    :root[data-theme="light"] { --background:var(--bg); --surface:var(--bg-2); --border:var(--line); --accent:var(--teal); --muted:var(--text-muted); --amber:var(--abstained); --red:var(--blocked); --green:var(--pass); }
    @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --background:var(--bg); --surface:var(--bg-2); --border:var(--line); --accent:var(--teal); --muted:var(--text-muted); --amber:var(--abstained); --red:var(--blocked); --green:var(--pass); } }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:var(--fs-body)/1.5 var(--body); }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:0; background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:24px 24px; }
    .topbar { position:fixed; inset:0 0 auto; z-index:10; height:56px; border-bottom:1px solid var(--line); backdrop-filter:blur(16px); background:color-mix(in srgb,var(--bg) 88%,transparent); }
    .topbar-inner { max-width:1480px; height:56px; margin:0 auto; padding:0 32px; display:flex; align-items:center; gap:28px; }
    .brand { display:flex; align-items:center; white-space:nowrap; font:700 17px var(--serif); letter-spacing:-.4px; }
    .brand-name span { color:var(--teal); }
    .local { margin-left:10px; padding:2px 6px; border:1px solid var(--line-2); border-radius:var(--r-1); background:var(--overlay); color:var(--text-dim); font:500 var(--fs-micro) var(--mono); letter-spacing:.08em; text-transform:uppercase; }
    nav { display:flex; gap:2px; overflow-x:auto; }
    button { color:var(--text-dim); background:transparent; border:1px solid transparent; border-radius:var(--r-2); padding:6px 12px; font:inherit; cursor:pointer; white-space:nowrap; }
    button:hover { color:var(--text); background:var(--overlay); }
    button[aria-current="page"] { color:var(--teal); background:var(--teal-dim); }
    .topbar-right { display:flex; align-items:center; gap:16px; margin-left:auto; }
    .host, .updated { color:var(--text-muted); font:var(--fs-small) var(--mono); white-space:nowrap; }
    .theme-button { color:var(--text); border-color:var(--line-2); background:var(--bg-2); }
    main { position:relative; z-index:1; width:min(1480px,100%); margin:0 auto; padding:80px 32px 48px; }
    .view { min-height:240px; }
    .view[hidden] { display:none; }
    .view-message { color:var(--muted); }
    .view-skeleton { display:grid; gap:18px; }
    .skeleton-block { position:relative; overflow:hidden; border:1px solid color-mix(in srgb,var(--line) 70%,transparent); border-radius:var(--r-3); background:color-mix(in srgb,var(--overlay) 72%,var(--bg-2)); }
    .skeleton-block::after { position:absolute; inset:0; content:""; transform:translateX(-100%); background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--text) 7%,transparent),transparent); animation:skeleton-shimmer 2.8s ease-in-out infinite; }
    .skeleton-heading { width:min(220px,45%); height:14px; }
    .skeleton-cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
    .skeleton-card { min-height:96px; }
    .skeleton-list { min-height:220px; }
    .visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @keyframes skeleton-shimmer { 100% { transform:translateX(100%); } }
    @media (prefers-reduced-motion: reduce) { .skeleton-block::after { animation:none; } }
    @media (max-width:620px) { .skeleton-cards { grid-template-columns:1fr; } .skeleton-card { min-height:72px; } }
    .view h1, .view h2, .view h3, .view h4 { margin:0 0 12px; color:var(--muted); font-size:var(--fs-small); font-weight:650; letter-spacing:.04em; line-height:1.4; text-transform:uppercase; }
    #protocol-view h1, #protocol-view h2, #protocol-view h3, #protocol-view h4 { margin:0; color:var(--text); letter-spacing:0; line-height:normal; text-transform:none; }
    #protocol-view ul { margin:0; padding:0; }
    .view table { width:100%; border-collapse:collapse; text-align:left; }
    .view th { padding:9px 12px; border-bottom:1px solid var(--border); color:var(--muted); font-size:var(--fs-small); font-weight:600; }
    .view td { padding:10px 12px; border-bottom:1px solid var(--border); }
    .view tbody tr:hover { background:var(--surface); }
    .view td.number, .view th.number, .view .number { font-variant-numeric:tabular-nums; text-align:right; }
    .view button[aria-pressed] { padding:4px 10px; border:1px solid var(--border); border-radius:var(--r-pill); color:var(--muted); background:var(--surface); font-size:var(--fs-body); }
    .view button[aria-pressed="true"] { border-color:var(--accent); color:var(--on-teal); background:var(--accent); }
    .view :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .view .view-message { padding:12px 14px; border:1px solid var(--border); border-radius:var(--r-3); background:var(--surface); }
    @media (max-width:620px) { .topbar { height:auto; min-height:56px; } .topbar-inner { height:auto; min-height:56px; flex-wrap:wrap; gap:8px; padding:8px 16px; } nav { order:3; width:100%; } .topbar-right { gap:8px; } main { padding:96px 16px 48px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
    <div class="brand"><span class="brand-name">snod<span>o</span></span><span class="local">local</span></div>
    <nav aria-label="Dashboard views">
      <button type="button" data-view="now" data-hash="#/now">Now</button>
      <button type="button" data-view="delivery" data-hash="#/delivery">Delivery</button>
      <button type="button" data-view="gates" data-hash="#/gates">Gates</button>
      <button type="button" data-view="plans" data-hash="#/plans">Plans</button>
      <button type="button" data-view="protocol" data-hash="#/protocol">Protocol</button>
    </nav>
    <div class="topbar-right"><span class="project-identity" id="project-identity"></span><span class="host" id="host"></span><time class="updated" id="updated" aria-live="polite"></time>
    <button class="theme-button" id="theme-toggle" type="button" aria-label="Toggle color theme">Theme</button></div>
    </div>
  </header>
  <main>
    <section class="view" id="view-now" aria-label="Now"></section>
    <section class="view" id="view-delivery" aria-label="Delivery" hidden></section>
    <section class="view" id="view-gates" aria-label="Gates" hidden></section>
    <section class="view" id="view-plans" aria-label="Plans" hidden></section>
    <section class="view" id="protocol-view" aria-label="Protocol" hidden></section>
  </main>
  <link rel="stylesheet" href="/static/protocol.css">
  <script src="/static/protocol.js"></script>
  <script src="/static/protocol-tiles.js"></script>
  <script src="/static/protocol-pipeline.js"></script>
  <script src="/static/protocol-validators.js"></script>
  <script src="/static/protocol-execution.js"></script>
  <script src="/static/protocol-savebar.js"></script>
  <script>
    (() => {
      const names = ["now", "delivery", "gates", "plans", "protocol"];
      const loaded = new Set(["protocol"]);
      const failed = new Set();
      const rendered = new Set();
      let active = "";
      let refreshTimer;

      const markdownReady = new Promise((resolve) => {
        const script = document.createElement("script");
        script.src = "/static/markdown.js";
        script.onload = resolve;
        script.onerror = resolve;
        document.head.append(script);
      });

      function showMessage(container, message) {
        const line = document.createElement("p");
        line.className = "view-message";
        line.textContent = message;
        container.replaceChildren(line);
        container.removeAttribute("aria-busy");
      }

      document.getElementById("host").textContent = location.host;
      fetch("/api/identity").then((response) => response.json()).then((identity) => {
        const label = document.getElementById("project-identity");
        const name = document.createElement("span");
        name.textContent = identity.name;
        const separator = document.createTextNode(": ");
        const remote = document.createElement("span");
        remote.textContent = identity.remote;
        label.append(name, separator, remote);
        label.title = `${identity.name}: ${identity.remote}`;
      }).catch(() => {});

      function markUpdated() {
        const updated = document.getElementById("updated");
        updated.textContent = `updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
      }

      function loadView(name) {
        if (loaded.has(name) || failed.has(name)) return Promise.resolve();
        return new Promise((resolve) => {
          const stylesheet = document.createElement("link");
          stylesheet.rel = "stylesheet";
          stylesheet.href = `/static/${name}.css`;
          document.head.append(stylesheet);
          const script = document.createElement("script");
          script.src = `/static/${name}.js`;
          script.onload = () => { loaded.add(name); resolve(); };
          script.onerror = () => {
            failed.add(name);
            showMessage(document.getElementById(name === "protocol" ? "protocol-view" : `view-${name}`), "This view could not be loaded.");
            resolve();
          };
          document.head.append(script);
        });
      }

      function showSkeleton(container) {
        container.setAttribute("aria-busy", "true");
        const skeleton = document.createElement("div");
        skeleton.className = "view-skeleton";
        const status = document.createElement("span");
        status.className = "visually-hidden";
        status.setAttribute("role", "status");
        status.textContent = "Loading";
        const heading = document.createElement("div");
        heading.className = "skeleton-block skeleton-heading";
        const cards = document.createElement("div");
        cards.className = "skeleton-cards";
        for (let index = 0; index < 3; index += 1) {
          const card = document.createElement("div");
          card.className = "skeleton-block skeleton-card";
          cards.append(card);
        }
        const list = document.createElement("div");
        list.className = "skeleton-block skeleton-list";
        skeleton.append(status, heading, cards, list);
        container.replaceChildren(skeleton);
        return skeleton;
      }

      async function refresh(name) {
        if (name !== active || document.hidden) return;
        const container = document.getElementById(name === "protocol" ? "protocol-view" : `view-${name}`);
        const firstRender = !rendered.has(name);
        const skeleton = firstRender ? showSkeleton(container) : null;
        await markdownReady;
        await loadView(name);
        if (name !== active || document.hidden || failed.has(name)) return;
        const render = window.snodoViews && window.snodoViews[name];
        if (typeof render !== "function") {
          failed.add(name);
          showMessage(container, "This view is unavailable.");
          container.removeAttribute("aria-busy");
          return;
        }
        try {
          await render(container);
          if (skeleton && skeleton.parentNode === container) skeleton.remove();
          rendered.add(name);
          container.removeAttribute("aria-busy");
          markUpdated();
        } catch (_) {
          failed.add(name);
          showMessage(container, "This view could not be loaded.");
          container.removeAttribute("aria-busy");
        }
      }

      function navigate() {
        const requested = location.hash.replace(/^#\/?/, "");
        const name = names.includes(requested) ? requested : "now";
        if (!names.includes(requested)) history.replaceState(null, "", "#/now");
        active = name;
        document.querySelectorAll(".view").forEach((view) => {
          view.hidden = view.id !== (name === "protocol" ? "protocol-view" : `view-${name}`);
        });
        document.querySelectorAll("nav [data-view]").forEach((button) => {
          if (button.dataset.view === name) button.setAttribute("aria-current", "page");
          else button.removeAttribute("aria-current");
        });
        clearInterval(refreshTimer);
        refresh(name);
        refreshTimer = setInterval(() => refresh(active), 10000);
      }

      document.querySelectorAll("nav [data-view]").forEach((button) => {
        button.addEventListener("click", () => { location.hash = button.dataset.hash; });
      });
      document.getElementById("theme-toggle").addEventListener("click", () => {
        const current = document.documentElement.dataset.theme ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = current === "dark" ? "light" : "dark";
      });
      window.addEventListener("hashchange", navigate);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refresh(active);
      });
      if (!location.hash) location.hash = "/now";
      else navigate();
    })();
  </script>
</body>
</html>
