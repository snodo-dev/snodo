<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>snodo · local</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f7f8f7;
      --surface: #ffffff;
      --border: #e1e6e3;
      --text: #202925;
      --muted: #748079;
      --accent: #147d70;
      --amber: #a76512;
      --red: #b44c4c;
      --green: #347b56;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --background: #171c1a;
        --surface: #202724;
        --border: #343d38;
        --text: #e6ece8;
        --muted: #9ba9a1;
        --accent: #66c7b4;
        --amber: #e9b968;
        --red: #e58a84;
        --green: #82c79b;
      }
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --background: #f7f8f7;
      --surface: #ffffff;
      --border: #e1e6e3;
      --text: #202925;
      --muted: #748079;
      --accent: #147d70;
      --amber: #a76512;
      --red: #b44c4c;
      --green: #347b56;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --background: #171c1a;
      --surface: #202724;
      --border: #343d38;
      --text: #e6ece8;
      --muted: #9ba9a1;
      --accent: #66c7b4;
      --amber: #e9b968;
      --red: #e58a84;
      --green: #82c79b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .topbar {
      min-height: 64px;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 12px max(16px, calc((100vw - 1100px) / 2));
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .brand { display: flex; align-items: baseline; gap: 9px; white-space: nowrap; }
    .brand-name { font-weight: 700; letter-spacing: -0.04em; }
    .local, .updated { color: var(--muted); font-size: 12px; }
    .updated { margin-left: auto; white-space: nowrap; }
    nav { display: flex; gap: 4px; }
    button {
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 7px 10px;
      font: inherit;
      cursor: pointer;
    }
    button:hover { color: var(--text); background: var(--background); }
    button[aria-current="page"] { color: var(--accent); background: var(--background); }
    .theme-button { color: var(--text); border-color: var(--border); white-space: nowrap; }
    main { width: min(1100px, 100%); margin: 0 auto; padding: 28px 16px 48px; }
    .view { min-height: 240px; }
    .view[hidden] { display: none; }
    .view-message { color: var(--muted); }
    .view h1, .view h2, .view h3, .view h4 {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.04em;
      line-height: 1.4;
      text-transform: uppercase;
    }
    .view table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    .view th {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .view td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .view tbody tr:hover { background: var(--surface); }
    .view td.number, .view th.number, .view .number {
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .view button[aria-pressed] {
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface);
      font-size: 13px;
    }
    .view button[aria-pressed="true"] {
      border-color: var(--accent);
      color: var(--surface);
      background: var(--accent);
    }
    .view :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .view .view-message {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }
    @media (max-width: 620px) {
      .topbar { flex-wrap: wrap; gap: 8px; padding: 12px 16px; }
      nav { order: 3; width: 100%; overflow-x: auto; }
      nav button { flex: 1 0 auto; }
      .updated { font-size: 11px; }
      main { padding-top: 20px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-name">snodo</span><span class="local">local</span></div>
    <nav aria-label="Dashboard views">
      <button type="button" data-view="now" data-hash="#/now">Now</button>
      <button type="button" data-view="delivery" data-hash="#/delivery">Delivery</button>
      <button type="button" data-view="gates" data-hash="#/gates">Gates</button>
      <button type="button" data-view="plans" data-hash="#/plans">Plans</button>
    </nav>
    <time class="updated" id="updated" aria-live="polite"></time>
    <button class="theme-button" id="theme-toggle" type="button" aria-label="Toggle color theme">Theme</button>
  </header>
  <main>
    <section class="view" id="view-now" aria-label="Now"></section>
    <section class="view" id="view-delivery" aria-label="Delivery" hidden></section>
    <section class="view" id="view-gates" aria-label="Gates" hidden></section>
    <section class="view" id="view-plans" aria-label="Plans" hidden></section>
  </main>
  <script>
    (() => {
      const names = ["now", "delivery", "gates", "plans"];
      const loaded = new Set();
      const failed = new Set();
      let active = "";
      let refreshTimer;

      function showMessage(container, message) {
        const line = document.createElement("p");
        line.className = "view-message";
        line.textContent = message;
        container.replaceChildren(line);
      }

      function markUpdated() {
        const updated = document.getElementById("updated");
        updated.textContent = `updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
      }

      function loadView(name) {
        if (loaded.has(name) || failed.has(name)) return Promise.resolve();
        return new Promise((resolve) => {
          const stylesheet = document.createElement("link");
          stylesheet.rel = "stylesheet";
          stylesheet.href = `/static/${name}.css`;
          document.head.append(stylesheet);
          const script = document.createElement("script");
          script.src = `/static/${name}.js`;
          script.onload = () => { loaded.add(name); resolve(); };
          script.onerror = () => {
            failed.add(name);
            showMessage(document.getElementById(`view-${name}`), "This view could not be loaded.");
            resolve();
          };
          document.head.append(script);
        });
      }

      async function refresh(name) {
        if (name !== active || document.hidden) return;
        const container = document.getElementById(`view-${name}`);
        await loadView(name);
        if (name !== active || document.hidden || failed.has(name)) return;
        const render = window.snodoViews && window.snodoViews[name];
        if (typeof render !== "function") {
          failed.add(name);
          showMessage(container, "This view is unavailable.");
          return;
        }
        try {
          await render(container);
          markUpdated();
        } catch (_) {
          failed.add(name);
          showMessage(container, "This view could not be loaded.");
        }
      }

      function navigate() {
        const requested = location.hash.replace(/^#\/?/, "");
        const name = names.includes(requested) ? requested : "now";
        if (!names.includes(requested)) history.replaceState(null, "", "#/now");
        active = name;
        document.querySelectorAll(".view").forEach((view) => {
          view.hidden = view.id !== `view-${name}`;
        });
        document.querySelectorAll("nav [data-view]").forEach((button) => {
          if (button.dataset.view === name) button.setAttribute("aria-current", "page");
          else button.removeAttribute("aria-current");
        });
        clearInterval(refreshTimer);
        refresh(name);
        refreshTimer = setInterval(() => refresh(active), 10000);
      }

      document.querySelectorAll("nav [data-view]").forEach((button) => {
        button.addEventListener("click", () => { location.hash = button.dataset.hash; });
      });
      document.getElementById("theme-toggle").addEventListener("click", () => {
        const current = document.documentElement.dataset.theme ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = current === "dark" ? "light" : "dark";
      });
      window.addEventListener("hashchange", navigate);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refresh(active);
      });
      if (!location.hash) location.hash = "/now";
      else navigate();
    })();
  </script>
</body>
</html>
