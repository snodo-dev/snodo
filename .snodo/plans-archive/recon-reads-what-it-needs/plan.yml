intent: 'Recon agents read enough of the codebase to answer with verified file:line
  facts, and always return an answer. The reading budget is configurable like the
  validator''s. Recon reuses the validator and coder read tools: ranged reads, search,
  and repeat reads that cost no turn. Its final answer is delivered through a structured
  tool call, the same way validators submit a verdict, so an empty final message no
  longer loses the work.'
name: recon-reads-what-it-needs
