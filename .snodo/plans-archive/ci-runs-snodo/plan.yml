intent: A team can adopt snodo where its process already runs, which is CI. Snodo
  ships a container image of itself. A project's own protocol validators can judge
  a pull request's changes from the CLI. A GitHub Action wraps both. A docs page shows
  how to run snodo in GitHub Actions and GitLab CI.
name: ci-runs-snodo
