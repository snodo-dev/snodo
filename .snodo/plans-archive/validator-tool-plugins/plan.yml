intent: A third-party plugin can add a tool to the LLM validator's tool loop, and
  a protocol can opt a validator into it. That way, a validator can consult an external
  service (for example a decision model that answers yes/no questions over a large
  input) while the LLM still writes the verdict and its justification. Core stays
  vendor-neutral.
name: validator-tool-plugins
