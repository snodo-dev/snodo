intent: A stranger following the first-run quickstart in docs/runbook.md gets a working mock run from an empty directory, the instructions say only what the mock coder really does, the guidance that earlier versions carried (provider credentials, ignore rules and the protocol file, local endpoints without a key) is still there, and a test keeps the quickstart a single source. This is the fix-forward work tracked in issue #653 (review of PR #652).
