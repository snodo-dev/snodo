intent: Signing in to snodo cloud with OAuth feels finished and is safe for machines that also have an API key. The browser page shown after sign-in looks like part of snodo, a dead OAuth login never silently stops sync when an API key is available, and switching back to an API key really switches.
name: cloud-oauth-polish
