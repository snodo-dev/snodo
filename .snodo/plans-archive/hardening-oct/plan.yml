  - 2.3_cancel_not_overwritten
  - 2.4_http_transport_rebinding
  - 2.5_snodo_credentials_not_readable
  - 2.6_planner_writes_atomically
- depends_on:
  - 2
  id: 3
  tasks:
  - 3.1_tunnel_secrets_stay_put
