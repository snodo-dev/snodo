- depends_on: []
  id: 1
  tasks:
  - 1.3_branch_names_cannot_inject_git_options
  - 1.4_task_complete_writes_atomically
  - 1.5_cloud_sync_state_locked
  - 1.7_job_task_json_atomic
- depends_on:
  - 1
  id: 2
  tasks:
