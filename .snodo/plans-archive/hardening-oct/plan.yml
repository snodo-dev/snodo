intent: 'Close the concrete security and state-integrity gaps found by the hardening
  recons (rec_f3ade8, rec_f8c7a8, rec_30f4e0):

  - the HTTP transport is safe on a laptop;

  - secrets under .snodo can''t be read or written through workspace tools;

  - branch names can''t inject git options;

  - state files are written atomically and under lock;

  - a task''s completion is recorded only once its delivery outcome is known.'
name: hardening-oct
