intent: 'Cloud sync keeps working without the user stepping in:

  - no audit event is ever too large for the cloud to store;

  - one unstorable event never stops automatic sync or liveness for its session;

  - the user is told about a stuck session where they look anyway;

  - old sessions'' unsent events drain on their own.'
name: cloud-sync-self-heals
