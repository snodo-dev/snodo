intent: Keep a project's live audit log small by archiving it weekly or by size, without breaking
  the hash chain. When the current audit.log's oldest event is more than 7 days old, or the
  file passes a size limit, it moves to an archive named by ISO week (for example audit.log.2026-w41).
  The next event chains from the archive's last event, with the sequence continuing. Opening
  the log loads only the current file. `snodo audit verify` and the readers that need history
  walk the archives in order. Readers become archive-aware first, and rotation is switched
  on last.
name: audit-archive
