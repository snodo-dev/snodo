intent: A CLI coder is told, before it runs, which repository paths the project's
  protocol declares off-limits, so it stops burning a full run on work that will only
  be halted after the fact. Separately, the post-hoc protected-path guard stops blaming
  a task for commits that arrived from the base branch via a rebase.
name: protected-paths-preventive-cli
