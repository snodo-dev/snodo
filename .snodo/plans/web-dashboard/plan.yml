intent: 'snodo dashboard gains a --web mode: a local, read-only web dashboard, bound
  to loopback, that shows what is running across the projects on this machine (Now),
  how work is landing (Delivery), what the gates sent back (Gates) and every plan
  with whether it reached main (Plans). The existing terminal dashboard keeps working
  unchanged and becomes --cli. Projects are found by scanning configured root folders
  for a .snodo/ directory. Every figure comes from files snodo already writes and
  from git, and a figure the data cannot support shows as unavailable. No new task,
  plan, job or validator states are introduced.'
name: web-dashboard
