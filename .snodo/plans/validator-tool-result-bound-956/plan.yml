intent: The LLM validator and recon tool loop hands tool results to the model without
  the bound the coder loop already applies, so one oversized result (a search hit
  on a multi-megabyte line) makes the provider refuse the request and the validator
  or recon agent fails.
name: validator-tool-result-bound-956
