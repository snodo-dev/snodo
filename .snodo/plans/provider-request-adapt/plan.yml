  --check) adapts to what a provider says it needs instead of failing: it applies
  a provider-requested parameter value such as reasoning_effort "none", reshapes messages
  for strict OpenAI-compatible servers when they reject the shape, remembers the adaptation
  per model, and models --check exercises the real multi-turn tool exchange so these
  failures show up before a run.'
