intent: A developer can bring snodo to their existing repository in any mainstream
  language and get a passing first run. snodo init detects the language and test command
  for Python, Node/TypeScript, Go and Rust. The mock coder writes a fixture that passes
  in that language. The interactive init on an existing repo walks through survey,
  decision-record intake and readiness, with no new top-level command. The docs give
  a per-language quickstart.
name: onboard-any-repo
