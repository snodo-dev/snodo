intent: 'Fixes #1055. Let a provider sign in with a ChatGPT subscription through OAuth
  instead of an API key. A provider says so explicitly in its settings; `snodo models
  --provider <name> --authenticate` signs in headless and refuses API-key providers;
  snodo refreshes the token under a cross-process lock where credentials are resolved
  so all model call sites share it without racing; an expired sign-in produces a message
  asking the operator to authenticate again. Small increments: token module and provider
  setting first, then credential hook, availability checks and the command, then check
  and benchmark behaviour, then documentation. No new state, status, severity or halt
  type, and no change to the cloud wire.'
intent_ref: int_24ce9a
name: chatgpt-oauth-provider
