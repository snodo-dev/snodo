intent: 'Fixes #1042. Record the operator''s intent as a first-class record that plans
  trace back to. Today the intent behind a body of work lives only in conversation,
  and a plan carries just its own free-text intent, so there is no durable link from
  a plan (and the waves and tasks under it) back to what the operator was trying to
  achieve. This plan adds, in small increments: a local intent store under .snodo/intents/
  with one record per intent (text, optional GitHub issue link, optional superseded
  intent), written once and never edited in place (a correction is a new intent that
  supersedes the old one, fix forward); one new local-only audit event, intent_recorded;
  an optional intent_ref on a plan that must point to an existing intent; MCP and
  CLI ways to record, read and list intents and to pass intent_ref when proposing
  a plan; read paths that show a plan''s intent_ref and an intent''s plans; and documentation
  (an ADR and a dated note on ADR 038). No new state, status, severity or halt type
  is added, and the cloud wire (plan_proposed and plan_run payloads, cloud schema
  baseline, interface version) does not change: intent_recorded is local only and
  intent_ref does not ride on the plan history events.'
name: intent-record-1042
