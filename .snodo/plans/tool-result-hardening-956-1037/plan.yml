intent: Two engine tool paths turn information into task failures. A coder's test
  run can return unbounded output into the model conversation and halt the task (#956),
  and a validator probing a path that is not in the repository ends the task as a
  validator error (#1037). Both should behave as bounded, informative tool results
  instead.
