intent: 'A host CLI coder can write outside its dispatched workspace through its shell
  tool, and the engine''s escape check misses most of it. Make the existing detection
  reliable after the fact and stop pretending containment exists where it does not:
  run the escape check on every way a coder run can end, refuse an explicitly configured
  sandboxed setting on a host CLI coder through the existing environment_error halt,
  and detect content changes in the operator''s checkout against a baseline taken
  before dispatch, failing closed when the baseline cannot be established. True prevention
  (a contained adapter per ADR 051) is out of scope. No new states, statuses, severities
  or halt types.'
name: coder-escape-guard-946
