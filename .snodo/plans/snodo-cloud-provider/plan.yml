intent: 'snodo cloud is a model provider out of the box. Once the user is logged in
  to snodo cloud (OAuth or API key), "snodo-cloud/<model>" works everywhere a model
  is used:

  - validators, classifier, recon and the litellm coder, through the gateway at https://models.snodo.dev/v1;

  - `snodo models --provider snodo-cloud`, which lists the models the organisation
  enabled;

  - the opencode-cli coder as "opencode-cli/snodo-cloud/<model>".

  Before login, the provider stays quietly unavailable.'
name: snodo-cloud-provider
