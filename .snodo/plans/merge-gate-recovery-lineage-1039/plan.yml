intent: A task whose recovery sub-task passes the quality gate ends "unmerged" because
  the merge gate accepts a passing verification only when its task_ref equals the
  original task id, while the recovery records it under "<task>_fix_<n>". The gate
  should count a passing verification recorded for the task's own recovery lineage,
  for the exact commit being delivered, and stay as strict as today about the commit
  and about unrelated tasks. No new states, statuses, severities or halt types.
