intent: 'Let an operator watch a recon work. Each recon records progress events to
  an append-only log in its own directory while its agents run, and snodo logs for
  a recon id with --watch shows them live (issue 1065). The recon state machine is
  unchanged: no new state, status, severity or halt type, and no change to the cloud
  wire.'
name: recon-event-stream
