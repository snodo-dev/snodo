intent: Every healthy piece of a plan reaches main as soon as it passes, and an unfinished
  plan keeps the orchestrator's attention until all of it lands. Each wave whose tasks
  all pass the gate is delivered to main without waiting for later waves. A blocked
  plan is reported as unfinished work, and the orchestrator is told to fix it forward
  inside that plan before starting anything new.
