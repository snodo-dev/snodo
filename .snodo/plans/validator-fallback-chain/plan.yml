intent: 'Let the validator model be a short ordered list. When the configured validator
  model fails for an operational reason that survived the existing transient retries
  (rate limit, timeout, connection fault, provider 5xx), the call is tried on the
  next model in the list, so one rate-limited provider no longer halts a whole task
  as validator_error. Verdicts are never a trigger: a model that answers (pass, warn,
  blocker, or an unusable verdict) is final, and a model is never switched because
  of what it said. Applies to every validator LLM call, including the wave validators
  and the work-type classifier. Recon already fails over this way; the new key follows
  that pattern. An exhausted list ends in the existing validator_error halt. No new
  state, status, severity or halt type.'
name: validator-fallback-chain
