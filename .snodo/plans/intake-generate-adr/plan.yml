intent: 'Add `snodo intake --generate-adr`: a model reads the repository''s code,
  finds clear patterns that no decision record states yet, and proposes ADRs the operator
  accepts or rejects one at a time. Accepted ones are written to the decision records
  folder with Status "Proposed"; when the repository has no decision records folder,
  intake says so and shows how to start one. The model is the one recon uses first
  (llm.recon.models). The MCP intake tool stays read-only. A new ADR amends ADR 044
  to record that intake now works in both directions. No new state, status, severity
  or halt type in snodo itself.'
name: intake-generate-adr
