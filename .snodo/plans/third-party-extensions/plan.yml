intent: A third-party validator, predicate or coder can be published as a pip-installable
  package and used just by installing it, the same way code-host providers already
  work through the snodo.providers entry-point group. snodo ready shows which extensions
  loaded and which failed, and docs/extending.md describes the install-and-reference
  path.
