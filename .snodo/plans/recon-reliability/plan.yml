intent: A multi-agent recon returns every answer its agents produce. One agent failing,
  whether from a provider error, a quota limit or a crash, never takes the other agents'
  work with it. Transient provider errors are retried once with the provider's suggested
  delay before the agent is reported as failed.
name: recon-reliability
