intent: No branch is merged or delivered unless snodo itself ran the project's gates on exactly the commit being merged, for that task, and recorded it. Every merge path (task into plan integration, plan into queue integration, plan delivery in every mode, single tasks) applies the same check, and the docs tell a first-time user what a run ends with.
name: merge-gate-hardening
