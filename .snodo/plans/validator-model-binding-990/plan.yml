intent: 'Make every validator call go to the provider of the validator''s own configured
  model: base URL, key and headers resolved together from that model on every call
  path. Today one completion function is bound once to the role''s default validator
  model and reused for validators pinned to other models, so a validator pinned to
  an OpenAI-compatible provider is sent to the wrong host with the default provider''s
  key, and the plain and structured paths silently answer with the default model.
  Fixes #990.'
name: validator-model-binding-990
