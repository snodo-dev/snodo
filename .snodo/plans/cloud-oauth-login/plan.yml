intent: A person can run `snodo cloud login`, sign in through their browser, and have snodo sync to snodo cloud with an OAuth token instead of an API key. The API key path keeps working unchanged. The token is stored in the user's own config directory with owner-only permissions, refreshed when it expires, and removed by logout.
name: cloud-oauth-login
