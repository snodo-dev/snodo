intent: 'Show where the model time and tokens of a run went: a per-role table (coder,
  each validator, the classifier) with input tokens, output tokens, model time and
  output tokens per second, printed at the end of a task run and of a plan run, and
  by `snodo logs <job_id>`. Calls that failed (including failed fallback attempts)
  count. The per-call records already exist in the job state; this plan attributes
  the two roles that are missing or unnamed (coder task, classifier) and renders the
  table. No new state, status, severity or halt type.'
name: usage-table
waves:
- depends_on: []
  id: 1
  tasks:
  - 1.1_classifier_calls_attributed
  - 1.2_coder_usage_carries_task
  - 1.3_job_logs_print_usage_table
