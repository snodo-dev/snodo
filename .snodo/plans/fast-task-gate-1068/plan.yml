intent: 'Make the per-task quality check fast (issue 1068): a new gate-task target runs
  the same lint, import-contract and ratchet steps as the full gate but only the tests
  that the task''s diff touches, with the full suite still run by CI, the release dry
  run and make gate. Small increments: the test selector, the documentation, then the
  gate target that uses it. No new state, status, severity or halt type, and no change
  to the cloud wire.'
