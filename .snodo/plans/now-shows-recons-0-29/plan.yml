intent: Make the local Now page show recons. Today the Recons counter is hardcoded
  to unavailable and the activity tree ignores recon runs, although each recon writes
  a state record under .snodo/recons. Wave 1 adds a small reader that classifies recon
  runs (running only if the process is alive or inside its deadline, since old records
  are left stuck on running); wave 2 uses it for the Recons counter and for the liveness
  of the activity tree in two independent tickets; wave 3 documents it. Read only;
  no new state, status, severity or halt type.
name: now-shows-recons-0-29
