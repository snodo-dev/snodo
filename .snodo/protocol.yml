# Job notifications (Slack, Discord, Teams, ntfy, webhook) are configured per
# user in ~/.snodo/config.yml under `notifications:` — not in this protocol.
# Example shape (keep endpoint credentials in user config):
# notifications:
#   targets:
#     - type: slack
#       name: team
#       url: env:SNODO_SLACK_WEBHOOK_URL
# See docs/configuration.md.

protocol_id: "snodo-public"
name: "snodo-public (solo, dogfood)"
version: "1.0.0"

modes:
  - mode_id: "producer"
    name: "Producer Mode"
    tools:
      - "edit"
      - "write"
      - "decide"
      - "dispatch"
      - "test"
      - "validate"
      - "review"
      - "approve"
      - "commit"
      - "merge"
      - "pr"
      - "plan"
      - "queue"
      - "read"
    concurrency: 1
    validators:
      - "security"
      - "architecture"
      - "adr"
      - "quality"
      - "meta-spec"
      - "acceptance"
    transitions: {}

validators:
  - validator_id: "security"
    validator_type: "security"
    evaluation_phase: "pre_execute"
    check_tool_access: true
    tools:
      - "read_file"
      - "list_files"
    criteria:
      - "Check for security vulnerabilities"
      - "Validate input sanitization"
      - "Check authentication/authorization, including the tunnel's bearer and service-token paths and any browser-facing link"
      - "Secrets (API keys, webhook URLs, bearer and tunnel tokens, watch-link tokens) must never be printed, logged, written to the audit log, or sent to the cloud"
      - "MCP writes stay inside write_allowed_prefixes; nothing grants a mutating tool to a mode that does not hold it"

  - validator_id: "architecture"
    validator_type: "architecture"
    evaluation_phase: "pre_execute"
    # A design-coherence judgement applies to the planned wave as a whole;
    # wave scope is valid for pre-execute validators only.
    scope: "wave"
    tools:
      - "read_file"
      - "list_files"
    criteria:
      - "Check design patterns"
      - "Validate separation of concerns"
      - "Check for tight coupling"

  - validator_id: "adr"
    validator_type: "architecture"
    evaluation_phase: "pre_execute"
    check_tool_access: true
    tools:
      - "read_file"
      - "list_files"
      - "summarize_directory"
    criteria:
      - "Read the decision records in docs/decisions (summarize_directory first, then the relevant records). A task that contradicts an accepted decision without saying it amends that decision is a blocker; name the record."
      - "Snodo's state machine is closed: a task that would add a task, plan, job or recon status, a severity, or a halt type is a blocker unless its spec explicitly says the operator approved that addition."
      - "The mode is the capability boundary: a task that exposes a tool to a mode that does not grant its capability, or makes a validator read the coder's own claims as evidence, is a blocker."
      - "A change to the cloud wire contract (cloud_sync payload shapes, interface version) must say how v5 receivers are protected and must update docs/specs/cloud-sync.md; otherwise warn."
      # Accepted from `snodo intake` (decision records' Decision sections), each citing its record:
      - "Local scope. A repository with no remote takes `local:<uuid>`, with scope `local`. This identifier means *this checkout*. Nothing can establish that two local checkouts are the same project — not across machines, not across paths on one machine — and no mechanism to try may be added. Path hashing, content fingerprinting and name matching are all excluded. A local project is a leaf. (from docs/decisions/012-project-identity-from-git-remote.md)"
      - "Identity is hashed. `project_id` is an input to `_compute_hash`, so it is part of what each audit event attests. A promotion therefore changes the identity of future events only; events already written keep the identity they were written under, and nothing rewrites them. (from docs/decisions/012-project-identity-from-git-remote.md)"
      - "Trigger: only post_execute validator outcomes. Pre-execute failures and hard, non-overridable blockers (INV3) halt immediately — never auto-fixed. (from docs/decisions/013-kleene-closure-auto-fix-recovery.md)"
      - "Running snodo against untrusted or third-party code is OUT OF SCOPE and unsupported. Isolation (containerisation, environment scrubbing, egress control) is explicitly not claimed. (from docs/decisions/014-trusted-repository-threat-model.md)"
      - "A second threat source remains in scope: the *agent* is semi-untrusted, because prompt injection (issue text, README, dependency documentation) can steer its tool calls. Defences against a manipulated agent — e.g. argument and path validation on tool inputs — remain in scope and are tracked separately. (from docs/decisions/014-trusted-repository-threat-model.md)"
      - "INV3 — a `blocker` is never overridable by a human decision. There is no \"authorise past a blocker\" path. (from docs/decisions/015-mcp-validation-four-outcome-contract.md)"
      - "Ordering — on `escalate` the token is minted only AFTER the human decision is recorded (out-of-band `snodo authorize`, then a re-call). A token is never returned alongside an escalation. (from docs/decisions/015-mcp-validation-four-outcome-contract.md)"
      - "`validator_error` is distinct — nothing is wrong with the work and there is no decision to make; it must not advise `snodo authorize`. (from docs/decisions/015-mcp-validation-four-outcome-contract.md)"
      - "Fail closed. If the store cannot be opened/read/written, verification raises `TokenStoreError` and the run halts with a clear error + audit event. There is no \"unsafe/skip\" escape hatch. Recovery is `rm tokens.db`; blast radius is bounded to the TTL window because older tokens already fail on `exp`. (from docs/decisions/016-token-single-use-sqlite-store.md)"
      - "A merge conflict is an escalate, not a blocker and not a crash: the merge is aborted (base branch stays clean), the task branch and worktree survive, and the run reports an escalation for a human to resolve. Cleanup is asymmetric — the worktree and branch are removed only after a successful merge; otherwise both are left intact. (from docs/decisions/018-auto-merge-task-branches.md)"
      - "Carry the original intent once, unchanged. `Task` gains `root_task_ref` and `root_spec`, set when a recovery subtask is spawned, and threaded through the graph state (`SerdeMixin`) and the closure driver's initial state. A recovery spec is built from `root_spec` — never from the previous attempt's spec — so it can never wrap itself. (from docs/decisions/021-recovery-builds-from-original-task.md)"
      - "A repeated verdict halts recovery. If an attempt produces a validator result identical (multiset of `validator_id`/`severity`/`justification`) to the previous attempt's, the loop sets `halt_type: \"recovery_stalled\"` (a blocker) before spawning another subtask. Repeating the same verdict proves the loop cannot converge; every further cycle costs a coder call plus a full quorum for nothing. (from docs/decisions/021-recovery-builds-from-original-task.md)"
      - "A versioned schema field. Every payload carries `schema` of the form `snodo.<command>.v<N>`. A consumer checks this field first; a mismatch means the shape changed and the consumer should refuse to parse rather than misread. Field names are asserted by the test suite, so a rename fails the suite rather than a downstream consumer. (from docs/decisions/022-machine-interface.md)"
      - "A non-spec objection must not silently reshape the spec. If the only escalation comes from non-spec validators (e.g. `architecture` or `security` warn), there is nothing to author from, so the task escalates normally (`halt_type: \"escalated\"`) instead of running a pointless rewrite. A non-spec blocker already halts before escalation and is unchanged (INV3). (from docs/decisions/023-spec-authoring-spec-quality-critique.md)"
      - "Operational Fault Classification: Failure of an environment preparation command is an operational fault (`validator_error`). It is never recorded as a validator judgement and never enters recovery (no recovery subtasks are spawned). (from docs/decisions/024-environment-preparation-and-task-isolation.md)"
      - "A structural isolation failure raises, it never degrades. `create_worktree` detects an unborn HEAD (no resolvable `HEAD` commit) before issuing any git command and raises `WorktreeIsolationError` with actionable guidance (make an initial commit; or pass `--no-isolation`). `setup_for_task` no longer swallows worktree-creation errors and returns `None` — the exception propagates to the caller. (from docs/decisions/025-unborn-head-worktree-fails-loud.md)"
      - "A background job is refused up front. `JobManager.submit` has no operator at a console to read a warning, so when the worktree cannot be created the job is marked `failed` and `submit()` raises — it is never spawned un-isolated in the project tree. (from docs/decisions/025-unborn-head-worktree-fails-loud.md)"
      - "INV2 Tool-Surface Protection for `.snodo/`: The workspace tool surface (`WorkspaceMCP` write, delete, and mkdir methods) and git staging (`GitMCP.stage_files`) enforce an invariant path boundary (INV2): any tool-surface mutation targeting `.snodo/` or files within `.snodo/` is refused. Path validation raises `PathValidationError` explicitly naming the path and explaining that paths under `.snodo/` are protected from tool-surface mutation. (from docs/decisions/026-protocol-protected-from-agent-mutation.md)"
      - "A `.snodo/` mutation is a blocker halt, not a revert. Reverting via `git checkout -- .snodo/` is a no-op for the gitignored/untracked files that are exactly the primary scenario, and a revert would launder a governance violation into \"no change detected\". The engine's `_execute_node` catches `SnodoMutationError`, sets a terminal `blocked` halt, marks post-validation skipped (never a green verdict on a mutated tree), and records a `snodo_mutation_blocked` audit event naming the paths. The tree is left for operator inspection. (from docs/decisions/027-in-place-coder-snodo-mutation-halt.md)"
      - "\"Unmet\" is distinct from \"uncheckable\". A criterion that cannot be verified from the tree (device behaviour, human judgement, a decision only a human can make) is reported as uncheckable and does NOT block good work. The judge is told to return `pass` for uncheckable criteria and to say so in the justification; only criteria that are verifiable from the tree and demonstrably unmet produce a warn. A validator that cannot tell \"unmet\" from \"uncheckable\" would block good work. (from docs/decisions/028-acceptance-validator.md)"
      - "Not a second `quality`. It judges completeness against the spec, not correctness of the code. It never runs commands; it reads the tree. The prompt explicitly forbids treating the test command as a criterion. (from docs/decisions/028-acceptance-validator.md)"
      - "`_merge_on_success` checks the audit log prior to merging a task branch. If no passing `verification_executed` event is present for the task in the audit log, the merge is refused (`unverified_merge_blocked`), and the branch is left unmerged for human review. (from docs/decisions/031-first-class-verification-audit-events.md)"
      - "\"Coder produced nothing\" raises `ExecutionError` on every path. `skip_engine_commit` controls *who commits*, not *whether observable work was produced*. Opting out of the engine's commit mechanism does not waive the obligation that the coder produce observable, attributable work. The `empty_artifact_warning` audit note is removed. (from docs/decisions/035-declared-coder-capability-interface.md)"
      - "Mock mode resolves a mock base. When mock mode is active or the coder is `MockAdapter`, the base is the coder's client or `mock_completion_fn` — so `--mock` remains hermetic for validators and classifier alike. (from docs/decisions/039-validation-independent-of-coder.md)"
      - "Fail-closed is unchanged where the client is genuinely absent. A validator with no completion function still returns `severity=\"blocker\"` with `error=True` (\"No completion_fn available\", `packages/snodo-engine/src/snodo/validators/llm_validator.py`) and halts the run. #143 removed the *engine-side reason* to ever construct a `None` client; it did not soften what a `None` client means if one is hand-built or the config is unusable. (from docs/decisions/039-validation-independent-of-coder.md)"
      - "The coder receives evidence, not a verdict. `run_tests` returns a `ValidatorResult` carrying a `severity` field — the exact type and the exact field the validators emit. Handing that object to the coder would conflate the two roles in the one place this ADR exists to keep them apart. The coder-facing surface returns the exit code, stdout and stderr. Existing MCP consumers keep the `ValidatorResult` shape; this is a second, narrower surface over the same execution, not a change to the first. (from docs/decisions/040-coder-observes-declared-test-runner.md)"
      - "The declared runner only; no arbitrary shell. The coder gets `ShellMCP`'s whitelist — `pytest`, `npm test`, `cargo test` (`packages/snodo-tools/src/snodo/tools/shell.py:49`) — and nothing else. Arbitrary shell access is an unacceptable expansion of the threat surface and would rewrite ADR 014's trusted-repository model rather than operate inside it. A project whose tests run some other way does not get this capability until its runner is declared. (from docs/decisions/040-coder-observes-declared-test-runner.md)"
      - "Modes stay roles. Modules cannot be expressed as modes. (from docs/decisions/041-modules-scope-tooling-not-modes.md)"
      - "`web` may add an accessibility validator that `api` does not run. A module must not remove a validator that would otherwise judge the work in a way that weakens the gate: the module list is intersected with the protocol's declared validators and cannot introduce one the protocol has not defined. Adjudication, the disagreement policy and the merge gate are untouched by module scope. (from docs/decisions/041-modules-scope-tooling-not-modes.md)"
      - "At the boundary of its budget a judge is asked for a verdict and given no way to keep reading. The final turn offers `submit_verdict` alone; the read tools are withdrawn. A verdict reached on incomplete reading is a real verdict: `warn` exists for exactly that, and a `warn` escalating to a human is the flow working, not failing. (from docs/decisions/045-a-judge-is-made-to-decide.md)"
      - "It takes the path errors already take — fail-closed. An engine that cannot get a verdict out of its quorum must not proceed. Nothing new is added to express this: `error=True` with severity `blocker`, the same as any other operational fault. The record of what a failing judge examined travels on the error result (`examined`), so a human can still see how far the inspection got. (from docs/decisions/045-a-judge-is-made-to-decide.md)"
      - "An unknown key under `llm` is a `ConfigLoadError`. Every model in the section (`LlmConfig`, `CoderConfig`, `ValidatorConfig`, `ValidatorLLMConfig`, `ClassifierConfig`, `ReconConfig`, `WaveConfig`) sets `model_config = ConfigDict(extra=\"forbid\")`. When validation fails only on extra keys, `load_llm_config` raises with a message naming each key and the section that owns it, and listing the section's valid keys. A non-extra validation failure keeps the existing generic message. (from docs/decisions/046-unknown-llm-config-key-fails-loud.md)"
      - "Remove the token requirement from the MCP tool surface. The `requires_token` flag is gone from every tool schema and `_enforce_wf1` is deleted; a tool call is never refused for want of a token the caller holds. Which tools exist and which a mode grants is unchanged. (from docs/decisions/047-mcp-tools-governed-not-token-gated.md)"
      - "At serve time: INV2 capability filtering — a server exposes exactly the concrete tools the active mode(s) grant, and rejects anything else as unknown. (from docs/decisions/047-mcp-tools-governed-not-token-gated.md)"
      - "The refusal is a `blocker`. It is never overridable by a human decision and sends the work back, using the existing blocker semantics. The protocol guarantee is narrow and firm: an enabled validator never silently passes a criterion it cannot verify. (from docs/decisions/052-validator-tool-access-is-a-declared-opt-in.md)"
      - "One interface bump. New event types, new `task_merged` fields and the new snapshot sections ship together as cloud interface version 6. Older events keep validating as they are; the new fields are optional in the shape. The lease-mint response advertises `interface_version`; a missing or invalid value means version 5. The client sends v6 only when the current lease advertises 6 or later. Under v5, it sends unchanged v5-compatible events and holds at the first v6-only event or v6-added data field, including the remaining chain suffix. It does not strip fields, since that would make `event_hash` attest to different data. A held event is retried with a newly minted lease on a later sync. Sync is not refused, no event is lost, and the hash chain the cloud receives has no gap. The new events are always written to the local audit log; only what goes on the wire waits. snodo-cloud must include the currently accepted `interface_version` in its successful lease-mint response and change it to 6 only after ingest and liveness accept v6. (from docs/decisions/054-cloud-sees-recons-queues-and-delivered-commits.md)"

  - validator_id: "quality"
    validator_type: "quality"
    evaluation_phase: "post_execute"
    # Default ships a command that runs on any POSIX shell and exits zero, so a
    # fresh project never halts on an unresolvable test command. Auto-detection
    # (marker files) and `snodo init --test-command` override it; while it
    # stands the quality validator records that NO tests were executed rather
    # than claiming a pass. Replace it with your stack's command:
    # The repo gate: pushes the branch to the gate host and runs the fast suite,
    # ruff, import contracts, ratchets and the changelog/vocabulary/schema checks.
    # It deselects e2e tests; `make gate-ci` includes them plus coverage (slower).
    tooling:
      test_command: "make gate"

  - validator_id: "meta-spec"
    validator_type: "architecture"
    evaluation_phase: "pre_execute"
    judges_spec: true
    criteria:
      - "The task spec must define INTENT and CONSTRAINTS — what to build and the boundaries it must respect — and leave implementation decisions to the coder. A spec describes behavior and contracts; it does not transcribe the implementation."
      - "ALLOWED in a spec (these are constraints, not implementation): function and method signatures, exported names, type and interface shapes, behavioral requirements (what it must do, what inputs it must reject), hard constraints (algorithm choice such as HS256, framework limits, dependency restrictions), specific required values that are genuine requirements (e.g. a 7-day expiry, a max-age), acceptance criteria, and occasional short code hints that clarify a constraint."
      - "PROHIBITED in a spec (this is the coder's job): literal function bodies, transcribed implementation logic, exact statement-by-statement code the coder should author, regex literals and exact API-call sequences presented as the implementation, and any spec that leaves the coder no implementation decisions to make."
      - "Guideline for judgment: if more than roughly 40% of the spec is literal implementation code rather than intent, contracts, and constraints, the spec is code-prescriptive and must be rejected as a blocker. The orchestrator must re-issue the task as intent plus constraints, not as transcribed code."
      - "A correctly-scoped spec leaves the coder room to author the implementation while still being unambiguous about what 'done' means. Reject specs that read as code wearing a spec's clothes."

  - validator_id: "acceptance"
    validator_type: "acceptance"
    evaluation_phase: "post_execute"
    severity_cap: "warn"
    tools:
      - "read_file"
      - "read_file_lines"
      - "list_files"
      - "git_show"
      - "git_log"
      - "read_diff_between_refs"
    criteria:
      - "Judge the produced artifacts against the acceptance criteria in the task spec. A criterion that is verifiable from the tree and unmet is a warn; a criterion that cannot be verified from the tree (device behaviour, human judgement) is uncheckable and never a finding."

# NOTE: `quality` and `acceptance` are the two POST_EXECUTE validators. Under
# `unanimous`, a phase with exactly one validator is an unopposed veto over
# completed work — a single flaky test or tool outage would block every task
# with no second opinion (Fixes #41). Keeping TWO post-execute judges here
# avoids that; if you remove one, either keep two post-execute validators or
# switch `disagreement_policy` below.

disagreement_policy: "unanimous"
initial_mode: "producer"

# Established repositories have verified build and test harnesses. Depth 3 enables
# multi-step incremental recovery (e.g. implementation fix followed by criterion refinement)
# while recovery stall detection bounds non-converging loops.
execution:
  max_recovery_depth: 3
  # Single-operator protocol: the operator is both producer and reviewer, so a
  # task that reaches a genuine "resolved" closure has already been accepted by
  # the only human in the loop. Merge its branch automatically so the work lands
  # on the base branch instead of stranding on a task branch.
  auto_merge: true

  # Set only when a repository needs a deterministic setup step after worktree
  # creation (protocol-authored shell commands are executed as written):
  # prepare_command: "uv sync --frozen"

# Queue defaults preserve strict FIFO and one plan at a time. Non-blocking and
# parallel runs are opt-in; use them only for independent plans (ADR 053).
queue:
  non_blocking: false
  parallel_runs: 1

# MCP writes are confined to .snodo/ by default; keep this explicit for the
# solo template so plans, specs, protocols, and queues can be authored in MCP.
write_allowed_prefixes:
  - .snodo/

# Optional module scopes for a monorepo; a module owns paths and may override
# test tooling and its decision-record location (ADR 041).
modules:
  - module_id: "core"
    paths: ["packages/snodo-core/**"]
  - module_id: "foundation"
    paths: ["packages/snodo-foundation/**"]
  - module_id: "engine"
    paths: ["packages/snodo-engine/**"]
  - module_id: "mcp"
    paths: ["packages/snodo-mcp/**"]
  - module_id: "tools"
    paths: ["packages/snodo-tools/**"]
  - module_id: "cli"
    paths: ["snodo/**"]
  - module_id: "docs"
    paths: ["docs/**", "README.md", "mkdocs.yml"]
# No module overrides tooling: every module falls back to `make gate`, because
# the packages depend on each other and a package-only suite would miss
# cross-package breakage. Modules here bound paths (files_in_scope), not tests.

# Keep an empty list until this repository has paths task branches must not
# change; for example, decision records can be protected from task diffs.
protected_paths: []
# protected_paths:
#   - "docs/decisions/**"

global_constraints: []
