site_name: Snodo
site_description: A protocol language for human-agent software teams
site_url: https://docs.snodo.dev
repo_url: https://github.com/snodo-dev/snodo
repo_name: snodo-dev/snodo
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  palette:
    scheme: slate
    primary: teal
    accent: teal
  font:
    text: Hanken Grotesk
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Use Snodo:
      - Quickstart: runbook.md
      - User configuration: configuration.md
      - Command reference: command-reference.md
      - Coder backends: coders.md
      - Authoring a plan: authoring-a-plan.md
      - Following a run: following-a-run.md
      - Following a plan run: following-a-plan-run.md
      - MCP queue tools: mcp-queues.md
      - Machine interface: machine-interface.md
      - Protocol reference: protocol.md
      - Cloud sync contract: specs/cloud-sync.md
      - Running unattended: running-unattended.md
      - Runbooks and guides:
          - Choosing models: choosing-models.md
          - Discovery and recon: decompose-and-recon.md
          - Evolving a protocol: evolving-the-protocol.md
          - MCP file writing: mcp-writing.md
          - Outcomes and recovery: outcomes.md
          - Queue triage: queue-triage.md
          - Keep queues moving: queues.md
      - Runbooks:
          - Minimal webapp: runbooks/01-minimal-webapp.md
          - Greenfield protocol: runbooks/02-greenfield-protocol.md
          - Hand-authored plan: runbooks/hand-authored-plan.md
  - Extend & contribute:
      - Architecture: architecture.md
      - Coder adapter contract: architecture/coder-adapter-contract.md
      - Extending Snodo: extending.md
      - Design decisions: decisions/README.md
  - Research: research/README.md

exclude_docs: |
  specs/*
  !specs/cloud-sync.md
  architecture/maturity-assessment-*.md
  architecture/verification-hardening-plan.md

not_in_nav: |
  decisions/0*.md
  research/*.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search
