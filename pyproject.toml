[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
snodo-core = { workspace = true }
snodo-tools = { workspace = true }
snodo-foundation = { workspace = true }
snodo-engine = { workspace = true }
snodo-mcp = { workspace = true }

[project]
name = "snodo"
version = "0.7.3"
dependencies = [
    "snodo-core==0.7.3",
    "snodo-tools==0.7.3",
    "snodo-foundation==0.7.3",
    "snodo-engine==0.7.3",
    "snodo-mcp==0.7.3",
    "pydantic>=2.12.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "textual>=1.0.0",
    "httpx>=0.27.0",
    "GitPython>=3.1.0",
    "litellm>=1.80,<2",
    "rich>=13.0.0",
]

description = "AI-native Software Development Lifecycle protocol engine"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "The Snodo Authors", email = "noreply@snodo.dev" }]
keywords = ["ai", "sdlc", "agents", "protocol", "governance", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://snodo.dev"
Repository = "https://github.com/snodo-dev/snodo"
Issues = "https://github.com/snodo-dev/snodo/issues"

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "hypothesis==6.165.10",
    "ruff==0.15.16",
    "radon>=6.0.0",
    "import-linter==2.12",
]
studies = [
    "marimo>=0.9.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
]
docs = [
    # Upper bound is deliberate: MkDocs 2.0 removes the plugin system and
    # rewrites theming, and mkdocs-material states it will not work there.
    # An unbounded >=1.6.0 would silently pull it in on a clean clone.
    "mkdocs>=1.6.0,<2",
    "mkdocs-material>=9.5.0,<10",
]

[project.scripts]
snodo = "snodo.cli.main:main"
snop = "snodo.cli.commands.dashboard_cmd:snop_entry"
snodo-prompt = "snodo.prompt_cmd:main"

[tool.setuptools.packages.find]
include = ["snodo*"]
namespaces = true

[tool.setuptools.package-data]
snodo = ["py.typed"]

[tool.pytest.ini_options]
# Default local run skips e2e for speed (~47s vs ~149s).
# Run the full suite:  pytest -m ""
# Run only e2e:       pytest -m e2e
# CI always runs the full suite regardless of addopts.
addopts = "-m 'not e2e'"

markers = [
    "e2e: end-to-end tests using subprocess invocation of the snodo CLI",
    "slow: tests that take more than a second to complete",
    "property: hypothesis property-based tests",
    "timeout: test execution timeout",
]
filterwarnings = [
    "ignore::UserWarning:langchain_core.utils.pydantic",
]

[dependency-groups]
dev = [
    "datasets==5.0.1",  # 5.0.0 and earlier: PYSEC-2026-3716, path traversal in folder-based builders
    "genbadge[coverage]==1.1.3",
    "grimp==3.14",
    "httpx2>=2.4.0",
    "hypothesis==6.165.10",
    "import-linter==2.12",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "radon>=6.0.1",
    "swebench>=4.0.0",
    "paramiko>=3.0.0",
    "scipy>=1.13",   # numpy-2.0-compatible; older scipy uses removed np.long and breaks swebench scoring
]

[tool.coverage.run]
source_pkgs = ["snodo"]
branch = true
relative_files = true
parallel = true
omit = ["*/tests/*", "*/__main__.py", "*/site-packages/*"]

[tool.coverage.paths]
snodo = ["snodo/", "packages/*/src/snodo/"]

[tool.ruff.lint]
# Pinned deliberately. This is ruff's DEFAULT rule set as of 0.15.x:
# F (Pyflakes) + E4/E7/E9 (a narrow slice of pycodestyle) = 61 rules.
# Ruff 0.16 widened its defaults from 61 rules to 415; unpinned, a routine
# dependabot bump would take this repo from "All checks passed" to 2,206
# findings with no code change. Rules are added to this list one at a time,
# each with its violations fixed in the same release.
select = [
    # ruff's default set as of 0.15.x — see the note above.
    "E4", "E7", "E9", "F",
    # Added deliberately, each after its violations were cleared:
    "B904",   # raise inside except without `from` — drops the cause chain,
              # which is what a halt payload needs to diagnose a failure.
    "S110",   # try-except-pass — a swallowed failure. One of these was
              # destroying a job's state.json before it was found by hand.
    "S105", "S311", "S314", "S602", "S603", "S607",  # flake8-bandit subset;
              # every remaining site carries a scoped noqa with its reason.
]

[tool.ruff.lint.per-file-ignores]
# The flake8-bandit rules describe a shipped binary's threat model, not a test
# harness's. Tests shell out to git and docker by name, and carry fake secrets
# in fixtures, both of which are correct there and neither of which is a
# finding. The rules stay enforced everywhere that ships.
"tests/**" = ["S"]
"experiments/**" = ["S"]
"studies/**" = ["S"]
