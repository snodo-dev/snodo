name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NO_COLOR: "1"
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Configure git
        run: |
          git config --global user.email "ci@snodo.dev"
          git config --global user.name "snodo CI"
          git config --global init.defaultBranch main
      - name: Install (uv workspace)
        run: uv sync --all-extras
      - name: Test + coverage
        shell: bash
        run: |
          # pipefail is REQUIRED: GitHub Actions runs `run:` as `bash -e {0}`,
          # which sets errexit but NOT pipefail. Without it the pipeline below
          # exits with tee's status (always 0) and pytest's exit code — and
          # --cov-fail-under with it — is silently discarded. This gate
          # reported green on every branch while main had a failing test.
          set -o pipefail
          uv run pytest tests/ -m "" -q -n auto --tb=short --timeout=60 \
            --cov --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=63 | tee coverage-output.txt
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          grep '^TOTAL' coverage-output.txt >> "$GITHUB_STEP_SUMMARY" || true
          uv run python scripts/enforce_patch_coverage.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (uv workspace)
        run: uv sync --all-extras
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Architecture (import-linter)
        run: uv run lint-imports

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (uv workspace)
        run: uv sync --all-extras
      - name: Export locked dependencies
        run: uv export --all-extras --no-dev --no-emit-project --no-emit-workspace -o requirements-audit.txt
      - name: Audit dependencies (pip-audit)
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements-audit.txt
      - name: Lint workflows (zizmor)
        run: uvx "zizmor@1.30.0" --format=github .
        env:
          GH_TOKEN: ${{ github.token }}
