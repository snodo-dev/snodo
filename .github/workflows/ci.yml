name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # codecov-action mints an OIDC token for tokenless uploads from public
      # repos; without this it falls back to the unauthenticated path, which
      # Codecov rate-limits — and fail_ci_if_error: false makes that silent.
      id-token: write
    env:
      NO_COLOR: "1"
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Configure git
        run: |
          git config --global user.email "ci@snodo.dev"
          git config --global user.name "snodo CI"
          git config --global init.defaultBranch main
      - name: Install (uv workspace)
        run: uv sync --all-extras
      - name: Test + coverage
        shell: bash
        run: |
          # pipefail is REQUIRED: GitHub Actions runs `run:` as `bash -e {0}`,
          # which sets errexit but NOT pipefail. Without it the pipeline below
          # exits with tee's status (always 0) and pytest's exit code — and
          # --cov-fail-under with it — is silently discarded. This gate
          # reported green on every branch while main had a failing test.
          set -o pipefail
          uv run pytest tests/ -m "" -q -n auto --tb=short --timeout=60 \
            --cov --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=75 | tee coverage-output.txt
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          grep '^TOTAL' coverage-output.txt >> "$GITHUB_STEP_SUMMARY" || true
          uv run python scripts/enforce_patch_coverage.py
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: ./coverage.xml
          # main is a protected branch, and Codecov refuses tokenless uploads
          # to protected branches ("Token required because branch is protected").
          token: ${{ secrets.CODECOV_TOKEN }}
          # Without this the CLI globs for coverage files as well as using
          # `files:`, and picks up the tee'd pytest output (coverage-output.txt)
          # as if it were a coverage report.
          disable_search: true
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (uv workspace)
        run: uv sync --all-extras
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Architecture (import-linter)
        run: uv run lint-imports

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Export locked dependencies
        # No `uv sync` here on purpose: the audit reads the lockfile, it does not
        # need the project installed. Installing also created a uv-managed .venv
        # with no `pip` in it, which the pypa/gh-action-pip-audit action then
        # activated and failed inside ("No module named pip"). uvx runs the tool
        # in its own isolated environment instead.
        run: uv export --all-extras --no-dev --no-emit-project --no-emit-workspace -o requirements-audit.txt
      - name: Audit dependencies (pip-audit)
        run: uvx "pip-audit@2.9.0" -r requirements-audit.txt
      - name: Lint workflows (zizmor)
        run: uvx "zizmor@1.30.0" --format=github .
        env:
          GH_TOKEN: ${{ github.token }}
