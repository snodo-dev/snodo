name: Release dry run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-dry-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Configure git
        run: |
          git config --global user.email "ci@snodo.dev"
          git config --global user.name "snodo CI"
          git config --global init.defaultBranch main
      - name: Install dependencies
        run: uv sync --all-extras
      # Keep the checks through the build step in sync with release.yml. Tag validation is not
      # applicable here because this workflow runs against a branch commit.
      - name: Test suite
        run: uv run pytest tests/ -q -n auto --timeout=60
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Architecture (import-linter)
        run: uv run lint-imports
      - name: File-length ratchet
        run: uv run python scripts/enforce_file_length.py
      - name: Docs-coverage ratchet
        run: uv run python scripts/enforce_docs_coverage.py
      - name: Closed-vocabulary check
        run: uv run python scripts/enforce_vocabularies.py
      - name: Cloud-schema ratchet
        run: uv run python scripts/enforce_cloud_schema.py
      - name: Build all packages
        run: uv build --all-packages
