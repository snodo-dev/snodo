name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Validate tag and CHANGELOG
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python scripts/check_release_version.py --tag "$RELEASE_TAG"
      - name: Test suite
        run: uv run pytest tests/ -q -n auto --timeout=60
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Architecture (import-linter)
        run: uv run lint-imports
      - name: Build all packages
        run: uv build --all-packages
      - name: Publish all artifacts
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
      - name: Create GitHub Release
        run: |
          uv run python scripts/changelog_release_body.py --tag "$RELEASE_TAG" > /tmp/release-notes.md
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file /tmp/release-notes.md \
            dist/*
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
