name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Validate tag and CHANGELOG
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python scripts/check_release_version.py --tag "$RELEASE_TAG"
      - name: Test suite
        run: uv run pytest tests/ -q -n auto --timeout=60
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Architecture (import-linter)
        run: uv run lint-imports
      - name: Build all packages
        run: uv build --all-packages
      - name: Publish all artifacts
        run: uv publish dist/*
      - name: Create GitHub Release
        run: |
          uv run python scripts/changelog_release_body.py --tag "$RELEASE_TAG" > /tmp/release-notes.md
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file /tmp/release-notes.md \
            dist/*
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
