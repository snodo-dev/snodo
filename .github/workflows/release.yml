name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Configure git
        run: |
          git config --global user.email "ci@snodo.dev"
          git config --global user.name "snodo CI"
          git config --global init.defaultBranch main
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Validate tag and CHANGELOG
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python scripts/check_release_version.py --tag "$RELEASE_TAG"
      - name: Test suite
        run: uv run pytest tests/ -q -n auto --timeout=60
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Architecture (import-linter)
        run: uv run lint-imports
      - name: Build all packages
        run: uv build --all-packages
      - name: Publish all artifacts
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          # Six packages are published in one step. A partial upload followed by
          # a re-run must not be fatal: v0.7.0 reached PyPI while the step still
          # exited 2, because re-uploading an existing file is an error by
          # default. Skip what is already there and let the rest through.
          skip-existing: true
      - name: Create GitHub Release
        run: |
          uv run python scripts/changelog_release_body.py --tag "$RELEASE_TAG" > /tmp/release-notes.md
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file /tmp/release-notes.md \
            dist/*
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
