name: PR review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review again
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            pr_number="$INPUT_PR_NUMBER"
          else
            pr_number="$(jq -r .pull_request.number "$GITHUB_EVENT_PATH")"
          fi
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
          if [[ "$(jq -r .head.repo.full_name <<<"$pr")" != "$GITHUB_REPOSITORY" || "$(jq -r .draft <<<"$pr")" == true ]]; then
            echo "PR must be non-draft and have its head in this repository" >&2
            exit 1
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install released snodo
        env:
          SNODO_VERSION: ${{ vars.SNODO_VERSION }}
        run: |
          uv venv "$RUNNER_TEMP/pr-review-venv"
          if [[ -n "$SNODO_VERSION" ]]; then
            uv pip install --python "$RUNNER_TEMP/pr-review-venv/bin/python" "snodo==$SNODO_VERSION"
          else
            uv pip install --python "$RUNNER_TEMP/pr-review-venv/bin/python" snodo
          fi
      - name: Configure snodo
        env:
          OLLAMA_CLOUD_API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
          OCGO_API_KEY: ${{ secrets.OCGO_API_KEY }}
          OCGO2_API_KEY: ${{ secrets.OCGO2_API_KEY }}
          SNODO_CLOUD_API_KEY: ${{ secrets.SNODO_CLOUD_API_KEY }}
        run: |
          install -d -m 700 "$HOME/.snodo"
          python - <<'PY'
          import os
          from pathlib import Path

          template = Path(".github/pr-review/config.yml").read_text()
          for placeholder, variable in {
              "${OLLAMA_CLOUD_API_KEY_ENV}": "OLLAMA_CLOUD_API_KEY",
              "${OCGO1_API_KEY_ENV}": "OCGO_API_KEY",
              "${OCGO2_API_KEY_ENV}": "OCGO2_API_KEY",
          }.items():
              template = template.replace(placeholder, variable)
          # The cloud key is read as a literal, so it is rendered by value into
          # the runner's own config (mode 600) and never into the workspace.
          template = template.replace(
              "${SNODO_CLOUD_API_KEY_VALUE}", os.environ.get("SNODO_CLOUD_API_KEY", "")
          )
          Path.home().joinpath(".snodo/config.yml").write_text(template)
          PY
          chmod 600 "$HOME/.snodo/config.yml"
      - name: Generate review comment
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          OLLAMA_CLOUD_API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
          OCGO_API_KEY: ${{ secrets.OCGO_API_KEY }}
          OCGO2_API_KEY: ${{ secrets.OCGO2_API_KEY }}
        run: |
          "$RUNNER_TEMP/pr-review-venv/bin/python" scripts/pr_review.py --pr "$PR_NUMBER" --repo "$REPOSITORY" --out "$RUNNER_TEMP/pr-review.md" --issue-body "$RUNNER_TEMP/fix-forward.md"
      - name: Create or update review comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          marker='<!-- snodo-pr-review -->'
          comment_file="$RUNNER_TEMP/pr-review-comment.md"
          { printf '%s\n\n' "$marker"; cat "$RUNNER_TEMP/pr-review.md"; } > "$comment_file"
          comment_id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate --jq '.[] | select(.body | contains("<!-- snodo-pr-review -->")) | .id' | head -n 1)"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body="$(cat "$comment_file")" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body="$(cat "$comment_file")" >/dev/null
          fi
      - name: Create or update fix-forward issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          body_file="$RUNNER_TEMP/fix-forward.md"
          [[ -f "$body_file" ]] || exit 0
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          title="Fix forward for #$PR_NUMBER: $(jq -r .title <<<"$pr")"
          review_url="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate --jq '.[] | select(.body | contains("<!-- snodo-pr-review -->")) | .html_url' | head -n 1)"
          [[ -n "$review_url" ]] || review_url="https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER"
          REVIEW_URL="$review_url" BODY_FILE="$body_file" python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["BODY_FILE"])
          path.write_text(path.read_text().replace("{{REVIEW_COMMENT_URL}}", os.environ["REVIEW_URL"]))
          PY
          prefix="Fix forward for #$PR_NUMBER:"
          issue_number="$(gh issue list --state open --limit 1000 --json number,title --jq ".[] | select(.title | startswith($(jq -Rn --arg value "$prefix" '$value'))) | .number" | head -n 1)"
          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" --body-file "$body_file"
          else
            gh issue create --title "$title" --body-file "$body_file"
          fi
