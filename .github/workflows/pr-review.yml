name: PR review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review again
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            pr_number="$INPUT_PR_NUMBER"
          else
            pr_number="$(jq -r .pull_request.number "$GITHUB_EVENT_PATH")"
          fi
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
          if [[ "$(jq -r .head.repo.full_name <<<"$pr")" != "$GITHUB_REPOSITORY" || "$(jq -r .draft <<<"$pr")" == true ]]; then
            echo "PR must be non-draft and have its head in this repository" >&2
            exit 1
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install released snodo
        env:
          SNODO_VERSION: ${{ vars.SNODO_VERSION }}
        run: |
          uv venv "$RUNNER_TEMP/pr-review-venv"
          if [[ -n "$SNODO_VERSION" ]]; then
            uv pip install --python "$RUNNER_TEMP/pr-review-venv/bin/python" "snodo==$SNODO_VERSION"
          else
            uv pip install --python "$RUNNER_TEMP/pr-review-venv/bin/python" snodo
          fi
      - name: Configure snodo
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OLLAMA_CLOUD_API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
          OCGO_API_KEY: ${{ secrets.OCGO_API_KEY }}
        run: |
          install -d -m 700 "$HOME/.snodo"
          python - <<'PY'
          from pathlib import Path

          template = Path(".github/pr-review/config.yml").read_text()
          for placeholder, variable in {
              "${OPENAI_API_KEY_ENV}": "OPENAI_API_KEY",
              "${OLLAMA_CLOUD_API_KEY_ENV}": "OLLAMA_CLOUD_API_KEY",
              "${OCGO_API_KEY_ENV}": "OCGO_API_KEY",
          }.items():
              template = template.replace(placeholder, variable)
          Path.home().joinpath(".snodo/config.yml").write_text(template)
          PY
          chmod 600 "$HOME/.snodo/config.yml"
      - name: Generate review comment
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/pr-review-venv/bin/python" scripts/pr_review.py --pr "$PR_NUMBER" --repo "$REPOSITORY" --out "$RUNNER_TEMP/pr-review.md"
      - name: Create or update review comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          marker='<!-- snodo-pr-review -->'
          comment_file="$RUNNER_TEMP/pr-review-comment.md"
          { printf '%s\n\n' "$marker"; cat "$RUNNER_TEMP/pr-review.md"; } > "$comment_file"
          comment_id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate --jq '.[] | select(.body | contains("<!-- snodo-pr-review -->")) | .id' | head -n 1)"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body="$(cat "$comment_file")" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body="$(cat "$comment_file")" >/dev/null
          fi
