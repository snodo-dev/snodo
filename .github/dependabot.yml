version: 2
updates:
  # cooldown keeps Dependabot from proposing a version published minutes ago —
  # the window in which a compromised release is most likely to still be live.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      major:
        update-types:
          - "major"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
