llm:
  recon:
    models:
      - ollama-cloud/deepseek-v4-pro:0813
      - ocgo1/qwen3.6-plus
      - ocgo2/mimo-v2.6-flash
providers:
  ollama-cloud:
    api_key_env: "${OLLAMA_CLOUD_API_KEY_ENV}"
    base_url: https://ollama.com/v1
    litellm_provider: openai
  ocgo1:
    api_key_env: "${OCGO1_API_KEY_ENV}"
    base_url: https://opencode.ai/zen/go/v1
    litellm_provider: openai
    extra_headers:
      x-opencode-session: "{task_id}"
  ocgo2:
    api_key_env: "${OCGO2_API_KEY_ENV}"
    base_url: https://opencode.ai/zen/go/v1
    litellm_provider: openai
    extra_headers:
      x-opencode-session: "{task_id}"
cloud:
  api_key: "${SNODO_CLOUD_API_KEY_VALUE}"
  sync_enabled: true
