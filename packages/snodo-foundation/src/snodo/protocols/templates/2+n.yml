# Job notifications (Slack, Discord, Teams, ntfy, webhook) are configured per
# user in ~/.snodo/config.yml under `notifications:` — not in this protocol.
# Example shape (keep endpoint credentials in user config):
# notifications:
#   targets:
#     - type: slack
#       name: team
#       url: env:SNODO_SLACK_WEBHOOK_URL
# See docs/configuration.md.

protocol_id: "2+n"
name: "2+N Reference Protocol"
version: "1.0.0"

# 2+N team pattern: 2 human-in-control roles + N specialized agents
# Reference configuration from Paper Listing 1 (Section 4.12)
# Producer-reviewer separation enforces Separation of Duties (WF1)

modes:
  - mode_id: "producer"
    name: "Producer Mode"
    # Producer cannot access reviewer tools (merge, approve)
    # Paper constraint: negative(producer_mode calls merge) - enforced by WF1
    # In this two-role template the producer also decides what work runs, so
    # plan (including queue control) and writing under .snodo/ live here. The
    # reviewer alone keeps approve/merge, preserving WF1 separation of duties.
    tools:
      - "edit"
      - "dispatch"
      - "test"
      - "validate"
      - "plan"
      - "write"
    # Optional mode-specific controls for a project with differing workloads:
    # concurrency: 2
    # max_recovery_depth: 3
    # coder: "litellm"
    # coder_config: {}
    validators:
      - "security"
      - "architecture"
      - "conventions"
      - "quality"
      - "protocol_adherence"
      - "meta-spec"
      - "acceptance"
    transitions:
      complete: "reviewer"

  - mode_id: "reviewer"
    name: "Reviewer Mode"
    # Reviewer cannot access producer tools (edit, dispatch)
    tools:
      - "review"
      - "approve"
      - "merge"
      - "pr"
    validators:
      - "security"
      - "architecture"
      - "quality"
      - "meta-spec"
    transitions:
      approved: "complete"
      rejected: "producer"

validators:
  - validator_id: "security"
    validator_type: "security"
    evaluation_phase: "pre_execute"
    tools:
      - "read_file"
      - "list_files"
      # Optional read-only tool for large directory trees:
      # - "summarize_directory"
    criteria:
      - "Check the task spec against OWASP Top 10 categories: injection, broken authentication, sensitive data exposure, XXE, broken access control, security misconfiguration, XSS, insecure deserialization, vulnerable components, insufficient logging"
      - "Verify no hardcoded credentials, secrets, tokens, or API keys in the implementation plan"
      - "Confirm input validation and output encoding requirements are specified for all user-facing interfaces"

  - validator_id: "architecture"
    validator_type: "architecture"
    evaluation_phase: "pre_execute"
    tools:
      - "read_file"
      - "list_files"
    criteria:
      - "Check the spec aligns with SOLID principles: single responsibility, open/closed, Liskov substitution, interface segregation, dependency inversion"
      - "Flag tight coupling between modules or unclear separation of concerns that violates established architectural patterns"
      - "Identify missing abstractions, circular dependencies, or leaky module boundaries"

  - validator_id: "conventions"
    validator_type: "conventions"
    evaluation_phase: "pre_execute"
    tools:
      - "read_file"
      - "list_files"
    criteria:
      - "Check the spec follows project naming conventions, file organization, and module boundaries"
      - "Verify documentation requirements: docstrings for public APIs, type hints, inline comments for non-obvious logic"
      - "Confirm test requirements are specified: unit tests for logic, integration tests for boundaries, edge case coverage"

  - validator_id: "quality"
    validator_type: "quality"
    evaluation_phase: "post_execute"
    # Default ships a command that runs on any POSIX shell and exits zero, so a
    # fresh project never halts on an unresolvable test command. Auto-detection
    # (marker files) and `snodo init --test-command` override it; while it
    # stands the quality validator records that NO tests were executed rather
    # than claiming a pass. Replace it with your stack's command:
    tooling:
      test_command: "echo 'snodo: no test_command configured; no tests executed'"
      # Override for your stack:
      #   test_command: "npm test"        # Node
      #   test_command: "pytest"          # Python
      #   test_command: "cargo test"      # Rust
      #   test_command: "go test ./..."   # Go
      #   test_command: "make test"       # Custom

  - validator_id: "protocol_adherence"
    validator_type: "protocol"
    evaluation_phase: "pre_execute"
    severity_cap: "warn"
    criteria:
      - "Examine the submitted task spec in light of the current mode's operational profile (tools, validators, transitions, name). Determine whether the work described falls within the operational scope implied by the mode's profile. Consider whether the work would more naturally belong to a sibling mode in this protocol. Flag mismatches with specific justification explaining which mode the work belongs in."

  - validator_id: "meta-spec"
    validator_type: "architecture"
    evaluation_phase: "pre_execute"
    judges_spec: true
    criteria:
      - "The task spec must define INTENT and CONSTRAINTS — what to build and the boundaries it must respect — and leave implementation decisions to the coder. A spec describes behavior and contracts; it does not transcribe the implementation."
      - "ALLOWED in a spec (these are constraints, not implementation): function and method signatures, exported names, type and interface shapes, behavioral requirements (what it must do, what inputs it must reject), hard constraints (algorithm choice such as HS256, framework limits, dependency restrictions), specific required values that are genuine requirements (e.g. a 7-day expiry, a max-age), acceptance criteria, and occasional short code hints that clarify a constraint."
      - "PROHIBITED in a spec (this is the coder's job): literal function bodies, transcribed implementation logic, exact statement-by-statement code the coder should author, regex literals and exact API-call sequences presented as the implementation, and any spec that leaves the coder no implementation decisions to make."
      - "Guideline for judgment: if more than roughly 40% of the spec is literal implementation code rather than intent, contracts, and constraints, the spec is code-prescriptive and must be rejected as a blocker. The orchestrator must re-issue the task as intent plus constraints, not as transcribed code."
      - "A correctly-scoped spec leaves the coder room to author the implementation while still being unambiguous about what 'done' means. Reject specs that read as code wearing a spec's clothes."

  - validator_id: "acceptance"
    validator_type: "acceptance"
    evaluation_phase: "post_execute"
    severity_cap: "warn"
    tools:
      - "read_file"
      - "read_file_lines"
      - "list_files"
      - "git_show"
      - "git_log"
      - "read_diff_between_refs"
    criteria:
      - "Judge the produced artifacts against the acceptance criteria in the task spec. A criterion that is verifiable from the tree and unmet is a warn; a criterion that cannot be verified from the tree (device behaviour, human judgement) is uncheckable and never a finding."

  # Validator options for multi-person projects can be set per judge:
  #   scope: "wave"                 # also "task" (default)
  #   check_tool_access: true       # refuse criteria outside its read-only tools
  #   model: "provider/model-id"    # otherwise use the configured validator model
  #   max_tool_turns: 20            # bounded read-tool loop override
  #   severity_cap: "warn"          # keep an experimental judge advisory
  #   judges_spec: true             # judge plan/spec wording before execution

disagreement_policy: "unanimous"
initial_mode: "producer"

# Paper constraints (Listing 1):
# Capability-level enforced via WF1 (disjoint tool sets):
#   negative(orchestrator_agent calls edit) → orchestrator lacks edit tool
#   negative(producer_mode calls merge) → merge is reviewer-only
# Spec-level now enforced via predicate framework (7.8):
#   negative(coder modifies out_of_scope) → files_in_scope predicate
#   positive(exists tests => dispatch) → tests_exist_for_modified predicate
global_constraints:
  - constraint_id: "files_in_scope"
    description: "All modified files must be within project scope"
    expression: "artifact_paths all match scope_paths"
    severity: "blocker"
    predicate: "files_in_scope"
    params:
      scope_paths:
        - "src/**"
        - "tests/**"
        - "docs/**"
        - "snodo/**"
  - constraint_id: "tests_exist"
    description: "Modified implementation files must have corresponding tests"
    expression: "for each non-test artifact a test file exists"
    severity: "blocker"
    predicate: "tests_exist_for_modified"
    params:
      test_dir_pattern: "tests/"
  - constraint_id: "no_secrets"
    description: "No secrets or credentials in committed diff"
    expression: "git diff has no credential patterns"
    severity: "blocker"
    predicate: "no_secrets_in_diff"
    params: {}

# Established repositories have verified build and test harnesses. Depth 3 enables
# multi-step incremental recovery (e.g. implementation fix followed by criterion refinement)
# while recovery stall detection bounds non-converging loops.
execution:
  max_recovery_depth: 3
  # Explicit environment setup when the project needs it (protocol-authored shell):
  # prepare_command: "uv sync"
  # Producer and reviewer are separate roles here: a resolved closure means the
  # producer's work passed mechanical verification, not that a human reviewed it.
  # Auto-merging would push unreviewed work onto the base branch and defeat the
  # point of the separation, so merging stays a deliberate operator action.

# Queue progression stays strict FIFO by default. Enable non-blocking or parallel
# runs only when later plans are independent, as described in docs/queues.md.
queue:
  non_blocking: false
  parallel_runs: 1

# MCP plan writes are project-relative and remain inside .snodo/.
write_allowed_prefixes:
  - ".snodo/"

# Add paths whose task diffs must never change (for example decision records):
protected_paths: []
# Example module scopes for monorepos (ADR 041); replace with real project paths:
# modules:
#   - module_id: "api"
#     paths: ["services/api/**"]
#     decisions_path: "services/api/docs/adr"
#     tooling:
#       test_command: "uv run pytest services/api -q"
