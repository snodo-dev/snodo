[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snodo-provider-github"
version = "0.20.3"
description = "GitHub code-host provider plugin for Snodo"
requires-python = ">=3.12"
dependencies = ["snodo-tools==0.20.3", "PyGithub>=2.0.0"]

[project.entry-points."snodo.providers"]
github = "snodo_provider_github:GitHubProvider"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
