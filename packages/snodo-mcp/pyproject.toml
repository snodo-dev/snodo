[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snodo-mcp"
version = "0.27.1"
description = "Snodo MCP — MCP servers, planning, recon, and jobs"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "The Snodo Authors", email = "noreply@snodo.dev" }]
dependencies = [
    "snodo-core==0.27.1",
    "snodo-tools==0.27.1",
    "snodo-foundation==0.27.1",
    "snodo-engine==0.27.1",
    "pydantic>=2.12.0",
    "mcp>=2.0.0,<3",
    "GitPython>=3.1.0",
    "httpx>=0.27.0",
    "pyjwt>=2.15.0",
    "filelock>=3.0.0",
    "tomlkit>=0.13.2",
    "docker>=7.0.0",
    "psutil>=7.0.0",
]

[project.urls]
Homepage = "https://snodo.dev"
Repository = "https://github.com/snodo-dev/snodo"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
snodo = ["py.typed", "mcp/guide_docs/*.md"]
