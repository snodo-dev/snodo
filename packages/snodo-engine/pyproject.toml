[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snodo-engine"
version = "0.26.0"
description = "Snodo engine — protocol loop graph, coders, and validators"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "The Snodo Authors", email = "noreply@snodo.dev" }]
dependencies = [
    "snodo-core==0.26.0",
    "snodo-tools==0.26.0",
    "snodo-foundation==0.26.0",
    "pydantic>=2.12.0",
    "pyyaml>=6.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.4.0",
    "langgraph>=0.2.0",
    # LiteLLM 1.106+ requires MCP 2.x; lift this bound when the MCP 2.x port lands.
    "litellm>=1.80.0,<1.106",
]

[project.urls]
Homepage = "https://snodo.dev"
Repository = "https://github.com/snodo-dev/snodo"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
snodo = ["py.typed"]
